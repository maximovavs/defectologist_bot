name: Logopedia R2 history diagnostic (isolated)

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/logopedia_r2_history_diagnostic.yml]

permissions: {}
cache-mode: read

jobs:
  history:
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 97 &&
      github.event.pull_request.commits == 3 &&
      github.repository == 'maximovavs/defectologist_bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/logopedia-r2-history-diagnostic' &&
      github.event.pull_request.base.sha == '5f13b5dcefde316944e26ef808dcbd0c48d3ad57' &&
      github.event.pull_request.user.login == 'maximovavs' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Guard exact base and main-cache provenance
        run: |
          test ! -e .state
          cat > "$RUNNER_TEMP/r2_history_guard.py" <<'PY'
          import http.client
          import json
          from urllib.parse import urlencode

          REPO = 'maximovavs/defectologist_bot'
          BASE = '5f13b5dcefde316944e26ef808dcbd0c48d3ad57'
          KEY = 'logoped-state-v12-prod-main-39114950056'
          VERSION = '5498a5e5c0938e01016201413f6a2f04a0456ba3f293ca60a3ef46eb75b2dc43'
          CACHE_ID = 9115191321


          def get_json(path):
              # Stable endpoint labels only; never expose paths, response bodies or exception messages.
              if path == 'git/ref/heads/main':
                  stage = 'main'
              elif path.startswith('actions/caches?'):
                  stage = 'cache'
              elif path.startswith('actions/workflows/218742009/runs?'):
                  stage = 'producer'
              else:
                  raise ValueError('api_endpoint_unexpected')
              conn = http.client.HTTPSConnection('api.github.com', timeout=15)
              try:
                  try:
                      conn.request('GET', '/repos/' + REPO + '/' + path, headers={
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28',
                          'User-Agent': 'logopedia-r2-readonly-diagnostic',
                      })
                      response = conn.getresponse()
                      if response.status != 200:
                          status = response.status if response.status in (401, 403, 404, 429, 500, 502, 503) else 'other'
                          raise ValueError(f'{stage}_http_{status}')
                      raw = response.read(2_000_001)
                  except (OSError, http.client.HTTPException):
                      raise ValueError(f'{stage}_transport_error') from None
                  if len(raw) > 2_000_000:
                      raise ValueError(f'{stage}_api_size')
                  try:
                      return json.loads(raw)
                  except (ValueError, UnicodeDecodeError):
                      raise ValueError(f'{stage}_json_invalid') from None
              finally:
                  conn.close()


          def verify_provenance(fetch):
              if fetch('git/ref/heads/main')['object']['sha'] != BASE:
                  raise ValueError('main_drift')
              data = fetch('actions/caches?' + urlencode({'key': KEY, 'per_page': 100}))
              entries = data['actions_caches']
              if data['total_count'] > 100:
                  raise ValueError('cache_inventory_unbounded')
              exact = [entry for entry in entries if entry['key'] == KEY]
              if len(exact) != 1:
                  raise ValueError('cache_absent_or_shadowed')
              cache = exact[0]
              expected = {'id': CACHE_ID, 'ref': 'refs/heads/main', 'version': VERSION,
                          'created_at': '2026-10-18T09:24:46.252346Z', 'size_in_bytes': 671437}
              if any(cache.get(field) != value for field, value in expected.items()):
                  raise ValueError('cache_identity_drift')
              runs = fetch('actions/workflows/218742009/runs?branch=main&per_page=10')['workflow_runs']
              prod = [run for run in runs if 'channel=prod' in run.get('display_title', '')]
              if not prod:
                  raise ValueError('latest_prod_unproven')
              latest = max(prod, key=lambda run: run['run_number'])
              expected_run = {'id': 39114950056, 'run_number': 526, 'run_attempt': 1,
                              'head_sha': BASE, 'head_branch': 'main', 'event': 'schedule',
                              'status': 'completed', 'conclusion': 'success'}
              if any(latest.get(field) != value for field, value in expected_run.items()):
                  raise ValueError('production_snapshot_not_latest')


          if __name__ == '__main__':
              try:
                  # GitHub enforces read-only cache access via scoped cache tokens.
                  # Runner v2.337.0 exposes ACTIONS_CACHE_MODE to Node/container
                  # actions, not run: shell steps. Do not read it from Python.
                  verify_provenance(get_json)
              except ValueError as error:
                  code = str(error)
                  expected = {'api_endpoint_unexpected', 'main_drift',
                              'cache_inventory_unbounded', 'cache_absent_or_shadowed',
                              'cache_identity_drift', 'latest_prod_unproven',
                              'production_snapshot_not_latest'}
                  for stage in ('main', 'cache', 'producer'):
                      expected.update({f'{stage}_http_{status}' for status in
                                       (401, 403, 404, 429, 500, 502, 503, 'other')})
                      expected.update({f'{stage}_{suffix}' for suffix in
                                       ('transport_error', 'api_size', 'json_invalid')})
                  if code not in expected:
                      code = 'unexpected_value_error'
                  raise SystemExit('BLOCKED: provenance_guard:' + code) from None
              except Exception:
                  raise SystemExit('BLOCKED: provenance_guard:unexpected_exception') from None
          PY
          python3 -I "$RUNNER_TEMP/r2_history_guard.py"

      - name: Restore exact production snapshot (read only)
        id: snapshot
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .state
          key: logoped-state-v12-prod-main-39114950056
          fail-on-cache-miss: true

      - name: Recheck provenance and emit bounded cooldown results
        env:
          CACHE_HIT: ${{ steps.snapshot.outputs.cache-hit }}
          RESTORED_CACHE_KEY: ${{ steps.snapshot.outputs.cache-matched-key }}
        run: |
          python3 -I "$RUNNER_TEMP/r2_history_guard.py"
          python3 -I - <<'PY'
          import hashlib
          import json
          import math
          import os
          import re
          import shutil
          import sqlite3
          import tempfile
          from contextlib import closing
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          SOURCES = (
              ('https://www.asha.org/about/press-room/articles/8-speech-and-language-skills-to-practice-with-your-preschooler-at-home/', '2e8bdfeb38fceb1e2aaf34d60f22b4639aae826a'),
              ('https://www.asha.org/public/developmental-milestones/communication-milestones-3-to-4-years/', 'd24a00949f4abeb71f366d7be1cdc33c4b1375ea'),
              ('https://www.asha.org/public/developmental-milestones/communication-milestones-4-to-5-years/', 'f093506652f64699a2df922c4cb53cf30c7f9aaf'),
              ('https://www.nationwidechildrens.org/family-resources-education/700childrens/2017/05/speech-and-communication-development-birth-to-3-years', '474121c1c49e1bcbdbbe1ab2d90d57fa7099d849'),
              ('https://www.asha.org/news/2023/how-to-build-back-to-school-readiness/', 'bdf092f127f307463ccd8b3d79b4e40d89cfc4dd'),
          )


          def connect_readonly(path):
              conn = sqlite3.connect(path.resolve().as_uri() + '?mode=ro&immutable=1', uri=True)
              conn.execute('PRAGMA query_only=ON')
              conn.execute('PRAGMA trusted_schema=OFF')
              return conn


          def inspect_history(source, now):
              if now.tzinfo is None:
                  raise ValueError("verification_timezone_required")
              now = now.astimezone(timezone.utc)
              source = Path(source)
              if source.parent.is_symlink() or source.is_symlink() or not source.is_file():
                  raise ValueError('missing_or_symlink_database')
              if any(Path(str(source) + suffix).exists() for suffix in ('-wal', '-shm', '-journal')):
                  raise ValueError('sidecar_requires_separate_review')
              if source.stat().st_size > 50_000_000:
                  raise ValueError('database_size_unbounded')
              original_hash = hashlib.sha256(source.read_bytes()).digest()
              since = now - timedelta(days=28)
              production_since = (now.astimezone(ZoneInfo("Asia/Nicosia")) - timedelta(days=28)).isoformat()
              urls, hashes = zip(*SOURCES)
              matches, blocked = [], set()
              with tempfile.TemporaryDirectory(prefix='logopedia-r2-ro-') as directory:
                  copy = Path(directory) / 'history.sqlite3'
                  shutil.copyfile(source, copy)
                  copy.chmod(0o400)
                  if hashlib.sha256(copy.read_bytes()).digest() != original_hash:
                      raise ValueError('copy_mismatch')
                  with closing(connect_readonly(copy)) as conn:
                      table = conn.execute("SELECT type, sql FROM sqlite_master WHERE name='publications'").fetchone()
                      if not table or table[0] != 'table' or not table[1].lstrip().upper().startswith('CREATE TABLE'):
                          raise ValueError('physical_publications_table_required')
                      columns = {row[1]: row[2].upper() for row in conn.execute('PRAGMA table_info(publications)')}
                      required = ('canonical_url', 'evidence_hash', 'posted_at', 'rubric_id')
                      if any(columns.get(column) != 'TEXT' for column in required):
                          raise ValueError('schema_mismatch')
                      rows = conn.execute(
                          'SELECT canonical_url, evidence_hash, posted_at, rubric_id, posted_at >= ? FROM publications '
                          'WHERE canonical_url IN (?,?,?,?,?) OR evidence_hash IN (?,?,?,?,?) LIMIT 1001',
                          (production_since,) + urls + hashes,
                      ).fetchall()
                      if len(rows) > 1000:
                          raise ValueError('matched_records_unbounded')
                      for url, evidence_hash, raw_time, rubric, production_recent in rows:
                          if not isinstance(raw_time, str) or len(raw_time) > 40:
                              raise ValueError('timestamp_invalid')
                          posted = datetime.fromisoformat(raw_time.replace('Z', '+00:00'))
                          if posted.tzinfo is None:
                              raise ValueError('timestamp_timezone_required')
                          posted = posted.astimezone(timezone.utc)
                          if posted > now:
                              raise ValueError('future_record')
                          if bool(production_recent) != (posted >= since):
                              raise ValueError("cooldown_timestamp_semantics_mismatch")
                          if posted < since:
                              continue
                          if not isinstance(rubric, str) or not re.fullmatch(r'[a-z0-9_]{1,64}', rubric):
                              raise ValueError('rubric_invalid')
                          if evidence_hash != '' and (not isinstance(evidence_hash, str) or not re.fullmatch(r'[0-9a-f]{40}', evidence_hash)):
                              raise ValueError('hash_invalid')
                          for index, (target_url, target_hash) in enumerate(SOURCES):
                              by = [name for name, yes in [('url', url == target_url), ('evidence_hash', evidence_hash == target_hash)] if yes]
                              if by:
                                  blocked.add(index)
                                  # Only the five authorized URLs and validated metadata may be emitted.
                                  matches.append({'url': target_url, 'matched_by': by,
                                                  'evidence_hash': evidence_hash,
                                                  'posted_at_utc': posted.isoformat(), 'rubric_id': rubric,
                                                  'cooldown_status': 'BLOCKED',
                                                  'remaining_cooldown_seconds': max(0, math.ceil((posted + timedelta(days=28) - now).total_seconds()))})
                  if hashlib.sha256(copy.read_bytes()).digest() != original_hash:
                      raise ValueError('copy_changed')
              if hashlib.sha256(source.read_bytes()).digest() != original_hash:
                  raise ValueError('restored_database_changed')
              return {'verification_time_utc': now.isoformat(), 'window_start_utc': since.isoformat(),
                      'matches': sorted(matches, key=lambda row: (row['url'], row['posted_at_utc'], row['matched_by'])),
                      'available_source_count': len(SOURCES) - len(blocked),
                      'eligibility_scope': 'exact_url_and_evidence_cooldown_only'}


          if __name__ == '__main__':
              try:
                  if os.environ.get('CACHE_HIT') != 'true' or os.environ.get('RESTORED_CACHE_KEY') != 'logoped-state-v12-prod-main-39114950056':
                      raise ValueError('exact_cache_restore_unconfirmed')
                  result = inspect_history(Path('.state/publication_history.sqlite3'), datetime.now(timezone.utc))
              except Exception:
                  raise SystemExit('BLOCKED: history_readonly_gate') from None
              print(json.dumps(result, ensure_ascii=True, separators=(',', ':')))
          PY
