name: Myth fact source runtime probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: |
          python -m pip install \
            "requests>=2.31.0,<3" \
            "beautifulsoup4>=4.12.2" \
            "lxml>=5.1.0" \
            "PyYAML>=6.0.1" \
            "Pillow>=10.3.0"

      - name: Probe configured myth_fact sources
        run: python -m scripts.probe_myth_fact_sources
