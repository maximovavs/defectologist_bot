name: Logoped Channel Bot v2.9

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN=1 (не публиковать, сохранить .state/dry_run/**)"
        required: false
        default: "0"
      audience:
        description: "AUDIENCE: parents | pros | both"
        required: false
        default: "both"
      provider:
        description: "REWRITE_PROVIDER: auto | groq | gemini"
        required: false
        default: "auto"
      target_channel:
        description: "Куда публиковать при ручном запуске: test | prod"
        required: false
        default: "test"
      engagement_mode:
        description: "Engagement after post: auto | polls_only | off"
        required: false
        type: choice
        default: "auto"
        options:
          - "auto"
          - "polls_only"
          - "off"
      rubric_id:
        description: "Какую рубрику тестировать"
        required: false
        type: choice
        default: "auto"
        options:
          - "auto"
          - "tip_of_day | Понедельник — Совет логопеда дня"
          - "play_and_speak | Вторник — Играем и говорим"
          - "myth_fact | Среда — Миф / Факт"
          - "bilingual_corner | Четверг — Русский за границей"
          - "question_week | Пятница — Вопрос недели"
          - "age_norms | Воскресенье — Возрастная норма"
          - "method_piggybank | Суббота — Методическая копилка"
      include_sources:
        description: "Только эти source IDs (через запятую, пусто = все)"
        required: false
        default: ""
      exclude_sources:
        description: "Исключить source IDs (через запятую, пусто = ничего не исключать)"
        required: false
        default: ""
      reset_test_db:
        description: "Сбросить test history DB перед ручным прогоном"
        required: false
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

run-name: >-
  Logoped Bot • ${{ github.event_name }} •
  channel=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_channel || 'prod' }} •
  provider=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.provider || 'auto' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_channel || 'prod' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      TZ: "Asia/Nicosia"

      # управлялки через manual dispatch (если это schedule — дефолты ниже)
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}
      AUDIENCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.audience || 'both' }}
      REWRITE_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.provider || 'auto' }}
      TARGET_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_channel || 'prod' }}
      RUBRIC_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rubric_id || '' }}
      INCLUDE_SOURCES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_sources || '' }}
      EXCLUDE_SOURCES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.exclude_sources || '' }}
      RESET_TEST_DB: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reset_test_db || 'no' }}
      POST_ENGAGEMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.engagement_mode || 'auto' }}
      POLL_OPEN_PERIOD_SECONDS: "86400"
      POLL_DISABLE_NOTIFICATION: "1"
      STATE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_channel || 'prod' }}
      TEST_DB_VERSION: "v12"
      STATE_CACHE_VERSION: "v12"

      # важно для logorina.ru (плохой TLS)
      INSECURE_TLS_DOMAINS: "logorina.ru"
      SUPPRESS_INSECURE_TLS_WARNINGS: "1"

      # анти-лимиты LLM
      LLM_MAX_RETRIES: "3"
      LLM_CALL_DELAY_SEC: "1.5"
      LLM_BACKOFF_MIN: "8"
      LLM_BACKOFF_MAX: "45"

      # лимиты publisher run
      MAX_RUN_SECONDS: "1500"
      MAX_CANDIDATES_PER_RUBRIC: "25"
      MAX_SKIPS_PER_RUBRIC: "12"
      MAX_LLM_SECONDS_PER_CANDIDATE: "180"
      IMAGE_PROMPT_TIMEOUT_SECONDS: "60"

      # Модели
      GROQ_MODEL: "openai/gpt-oss-120b"
      GROQ_FALLBACK_MODEL: "openai/gpt-oss-20b"
      GEMINI_MODEL: "gemini-2.5-flash"
      GEMINI_MODELS: "gemini-2.5-flash,gemini-2.5-flash-lite"

      # Pollinations
      POLLINATIONS_TIMEOUT_SECONDS: "25"
      POLLINATIONS_MAX_RETRIES: "3"
      POLLINATIONS_RETRY_SLEEP_SECONDS: "5"
      POLLINATIONS_MODEL: "flux"
      POLLINATIONS_WIDTH: "1280"
      POLLINATIONS_HEIGHT: "720"

      # Telegram рендеринг ссылок
      TELEGRAM_PARSE_MODE: "HTML"

      # sentence-transformers dedup
      SEMANTIC_THRESHOLD: "0.85"
      SEMANTIC_THRESHOLD_SOURCE: "0.93"
      SEMANTIC_THRESHOLD_POST: "0.86"
      SEMANTIC_MODEL_NAME: "all-MiniLM-L6-v2"
      MAX_LLM_REGEN_ATTEMPTS: "3"

      # общий лимит поста
      POST_MAX_CHARS: "1000"
      TG_CAPTION_MAX_BYTES: "950"

    steps:
      - uses: actions/checkout@v6

      - name: Restore .state cache
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: logoped-state-${{ env.STATE_CACHE_VERSION }}-${{ env.STATE_SCOPE }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            logoped-state-${{ env.STATE_CACHE_VERSION }}-${{ env.STATE_SCOPE }}-${{ github.ref_name }}-
            logoped-state-${{ env.STATE_CACHE_VERSION }}-${{ env.STATE_SCOPE }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DRAFTS_CHAT_ID: ${{ secrets.TELEGRAM_DRAFTS_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISUAL_QA_API_KEY: ${{ secrets.GEMINI_VISUAL_QA_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          mkdir -p .state
          python -u -m src.publisher.run_publisher

      - name: Inspect .state
        if: always()
        run: |
          echo "Contents of .state:"
          ls -la .state || true

      - name: Save .state cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .state
          key: logoped-state-${{ env.STATE_CACHE_VERSION }}-${{ env.STATE_SCOPE }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload dry-run artifacts
        if: ${{ env.DRY_RUN == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-artifacts
          path: .state/dry_run/**
          if-no-files-found: warn
