name: Logoped Channel Bot v2.4

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN=1 (не публиковать, сохранить .state/dry_run/**)"
        required: false
        default: "0"
      audience:
        description: "AUDIENCE: parents | pros | both"
        required: false
        default: "both"
      provider:
        description: "REWRITE_PROVIDER: auto | groq | gemini"
        required: false
        default: "auto"

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      TZ: "Asia/Nicosia"
      # управлялки через manual dispatch (если это schedule — дефолты ниже)
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}
      AUDIENCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.audience || 'both' }}
      REWRITE_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.provider || 'auto' }}

      # важно для logorina.ru (плохой TLS)
      INSECURE_TLS_DOMAINS: "logorina.ru"
      SUPPRESS_INSECURE_TLS_WARNINGS: "1"

      # Patch 2.0 — анти-лимиты (Groq backoff + throttle)
      LLM_MAX_RETRIES: "5"
      LLM_CALL_DELAY_SEC: "2"
      LLM_BACKOFF_MIN: "15"
      LLM_BACKOFF_MAX: "120"

      # Модели (можно менять без кода)
      GROQ_MODEL: "llama-3.3-70b-versatile"
      GEMINI_MODEL: "gemini-2.5-flash"

      # Telegram рендеринг ссылок
      TELEGRAM_PARSE_MODE: "HTML"

      # общий лимит поста (совпадает с кодом)
      POST_MAX_CHARS: "1000"
      TG_CAPTION_MAX_BYTES: "950"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DRAFTS_CHAT_ID: ${{ secrets.TELEGRAM_DRAFTS_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.publisher.run_publisher

      - name: Upload dry-run artifacts
        if: ${{ env.DRY_RUN == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-artifacts
          path: .state/dry_run/**
          if-no-files-found: warn
