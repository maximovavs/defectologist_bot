name: Logoped Channel Bot v2.2

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN=1 (не публиковать, сохранить .state/dry_run/**)"
        required: false
        default: "0"

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      TZ: "Asia/Nicosia"
      REWRITE_PROVIDER: "auto"
      AUDIENCE: "both"          # ✅ иначе pros-рубрики никогда не выйдут
      INSECURE_TLS_DOMAINS: "logorina.ru"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DRAFTS_CHAT_ID: ${{ secrets.TELEGRAM_DRAFTS_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.publisher.run_publisher

      - name: Upload dry-run artifacts
        if: ${{ env.DRY_RUN == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-artifacts
          path: .state/dry_run/**
          if-no-files-found: warn
