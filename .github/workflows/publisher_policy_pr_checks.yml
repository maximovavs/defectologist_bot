name: Publisher policy offline checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/publisher/run_publisher.py"
      - "src/publisher/dedup_policy.py"
      - "src/services/publication_store.py"
      - "src/services/topic_policy.py"
      - "src/services/llm_generator.py"
      - "src/services/engagement_builder.py"
      - "src/services/poll_builder.py"
      - "config/sources.yml"
      - "config/topics.yml"
      - "config/rubrics.yml"
      - "scripts/probe_myth_fact_sources.py"
      - "scripts/resolve_production_state_predecessor.py"
      - ".github/workflows/myth_fact_source_probe.yml"
      - ".github/workflows/post.yml"
      - "tests/test_bilingual_corner_policy.py"
      - "tests/test_bilingual_repair.py"
      - "tests/test_content_grounding.py"
      - "tests/test_cross_language_sound_policy.py"
      - "tests/test_editorial_apparatus_boundary.py"
      - "tests/test_engagement_builder.py"
      - "tests/test_hashtag_policy.py"
      - "tests/test_parent_age_policy.py"
      - "tests/test_parent_benefit_policy.py"
      - "tests/test_parent_hearing_inference.py"
      - "tests/test_parent_oral_safety.py"
      - "tests/test_parent_phoneme_notation.py"
      - "tests/test_parent_step_count_policy.py"
      - "tests/test_poll_builder.py"
      - "tests/test_pro_friendly_repair.py"
      - "tests/test_response_decoding.py"
      - "tests/test_rubric_quality.py"
      - "tests/test_thematic_parents_policy.py"
      - "tests/test_workflow_contract.py"
      - "tests/test_llm_provider_budget.py"
      - "tests/test_topic_policy.py"
      - "tests/test_bounded_topic_detection_window.py"
      - "tests/test_editorial_freshness_policy.py"
      - "tests/test_myth_fact_fidelity.py"
      - "tests/test_myth_fact_claim_freshness.py"
      - "tests/test_myth_fact_source_probe.py"
      - "tests/test_parent_age_evidence_fidelity.py"
      - "tests/test_question_week_over_max_chars.py"
      - "tests/test_parent_modality_fidelity.py"
      - "tests/test_parent_diagnostic_role_boundary.py"
      - "tests/test_exercise_coherence_policy.py"
      - "tests/test_parent_human_text_quality.py"
      - "tests/test_method_piggybank_policy.py"
      - "tests/test_method_piggybank_tier1_source_routing.py"
      - "tests/test_publisher_reason_attribution.py"
      - "tests/test_telegram_visual_delivery.py"
      - "tests/test_post_polls.py"
      - "tests/test_publication_delivery_state.py"
      - ".github/workflows/publisher_policy_pr_checks.yml"

permissions:
  contents: read

jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install policy-test dependencies
        run: |
          python -m pip install \
            "requests>=2.31.0,<3" \
            "beautifulsoup4>=4.12.2" \
            "lxml>=5.1.0" \
            "PyYAML>=6.0.1" \
            "Pillow>=10.3.0" \
            "python-dateutil>=2.9.0.post0" \
            "feedparser>=6.0.11"

      - name: Compile publisher policy paths
        run: |
          python -m py_compile \
            src/publisher/run_publisher.py \
            src/publisher/dedup_policy.py \
            src/services/publication_store.py \
            src/services/topic_policy.py \
            src/services/llm_generator.py \
            src/services/engagement_builder.py \
            src/services/poll_builder.py \
            scripts/probe_myth_fact_sources.py \
            scripts/resolve_production_state_predecessor.py \
            tests/test_bilingual_corner_policy.py \
            tests/test_bilingual_repair.py \
            tests/test_content_grounding.py \
            tests/test_cross_language_sound_policy.py \
            tests/test_editorial_apparatus_boundary.py \
            tests/test_engagement_builder.py \
            tests/test_hashtag_policy.py \
            tests/test_parent_age_policy.py \
            tests/test_parent_benefit_policy.py \
            tests/test_parent_hearing_inference.py \
            tests/test_parent_oral_safety.py \
            tests/test_parent_phoneme_notation.py \
            tests/test_parent_step_count_policy.py \
            tests/test_poll_builder.py \
            tests/test_pro_friendly_repair.py \
            tests/test_response_decoding.py \
            tests/test_rubric_quality.py \
            tests/test_thematic_parents_policy.py \
            tests/test_workflow_contract.py \
            tests/test_llm_provider_budget.py \
            tests/test_topic_policy.py \
            tests/test_bounded_topic_detection_window.py \
            tests/test_editorial_freshness_policy.py \
            tests/test_myth_fact_fidelity.py \
            tests/test_myth_fact_claim_freshness.py \
            tests/test_myth_fact_source_probe.py \
            tests/test_parent_age_evidence_fidelity.py \
            tests/test_question_week_over_max_chars.py \
            tests/test_parent_modality_fidelity.py \
            tests/test_parent_diagnostic_role_boundary.py \
            tests/test_exercise_coherence_policy.py \
            tests/test_parent_human_text_quality.py \
            tests/test_method_piggybank_policy.py \
            tests/test_method_piggybank_tier1_source_routing.py \
            tests/test_publisher_reason_attribution.py \
            tests/test_telegram_visual_delivery.py \
            tests/test_post_polls.py \
            tests/test_publication_delivery_state.py

      - name: Run publisher policy regressions offline
        env:
          GEMINI_API_KEY: ""
          GEMINI_VISUAL_QA_API_KEY: ""
          GROQ_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_DRAFTS_CHAT_ID: ""
          POLLINATIONS_TOKEN: ""
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
        run: |
          python - <<'PY'
          import sys
          import types
          import unittest

          sentence_transformers = types.ModuleType("sentence_transformers")

          class _UnavailableModel:
              def __init__(self, *args, **kwargs):
                  raise RuntimeError("disabled in offline policy checks")

          class _Util:
              @staticmethod
              def pytorch_cos_sim(*args, **kwargs):
                  raise RuntimeError("semantic backend should be stubbed by tests")

          sentence_transformers.SentenceTransformer = _UnavailableModel
          sentence_transformers.util = _Util()
          sys.modules["sentence_transformers"] = sentence_transformers

          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_bilingual_corner_policy",
              "tests.test_bilingual_repair",
              "tests.test_content_grounding",
              "tests.test_cross_language_sound_policy",
              "tests.test_editorial_apparatus_boundary",
              "tests.test_engagement_builder",
              "tests.test_hashtag_policy",
              "tests.test_parent_age_policy",
              "tests.test_parent_benefit_policy",
              "tests.test_parent_hearing_inference",
              "tests.test_parent_oral_safety",
              "tests.test_parent_phoneme_notation",
              "tests.test_parent_step_count_policy",
              "tests.test_poll_builder",
              "tests.test_pro_friendly_repair",
              "tests.test_response_decoding",
              "tests.test_rubric_quality",
              "tests.test_thematic_parents_policy",
              "tests.test_workflow_contract",
              "tests.test_llm_provider_budget",
              "tests.test_topic_policy",
              "tests.test_bounded_topic_detection_window",
              "tests.test_editorial_freshness_policy",
              "tests.test_myth_fact_fidelity",
              "tests.test_myth_fact_claim_freshness",
              "tests.test_myth_fact_source_probe",
              "tests.test_parent_age_evidence_fidelity",
              "tests.test_question_week_over_max_chars",
              "tests.test_parent_modality_fidelity",
              "tests.test_parent_diagnostic_role_boundary",
              "tests.test_exercise_coherence_policy",
              "tests.test_parent_human_text_quality",
              "tests.test_method_piggybank_policy",
              "tests.test_method_piggybank_tier1_source_routing",
              "tests.test_publisher_reason_attribution",
              "tests.test_telegram_visual_delivery",
              "tests.test_post_polls",
              "tests.test_publication_delivery_state",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
