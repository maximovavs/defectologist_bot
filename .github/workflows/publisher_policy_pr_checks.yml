              '                    return out2, True, f"ok:gemini_retry:{GEMINI_MODELS[0]}"\n'
              '                return "", False, f"invalid_gemini_retry:{reason2}"\n'
              '\n'
          )
          gemini_fragment = gemini_fragment.replace(
