name: Publisher policy offline checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/publisher/run_publisher.py"
      - "src/services/topic_policy.py"
      - "config/sources.yml"
      - "tests/test_topic_policy.py"
      - "tests/test_editorial_freshness_policy.py"
      - ".github/workflows/publisher_policy_pr_checks.yml"
  push:
    branches:
      - "agent/p1b-myth-fact-fidelity"

permissions:
  contents: write

jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install policy-test dependencies
        run: |
          python -m pip install \
            "requests>=2.31.0,<3" \
            "beautifulsoup4>=4.12.2" \
            "lxml>=5.1.0" \
            "PyYAML>=6.0.1" \
            "Pillow>=10.3.0" \
            "python-dateutil>=2.9.0.post0" \
            "feedparser>=6.0.11"

      - name: Compile publisher policy paths
        run: |
          python -m py_compile \
            src/publisher/run_publisher.py \
            src/services/topic_policy.py \
            tests/test_topic_policy.py \
            tests/test_editorial_freshness_policy.py

      - name: Run publisher policy regressions offline
        env:
          GEMINI_API_KEY: ""
          GEMINI_VISUAL_QA_API_KEY: ""
          GROQ_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_DRAFTS_CHAT_ID: ""
          POLLINATIONS_TOKEN: ""
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
        run: |
          python - <<'PY'
          import sys
          import types
          import unittest

          sentence_transformers = types.ModuleType("sentence_transformers")

          class _UnavailableModel:
              def __init__(self, *args, **kwargs):
                  raise RuntimeError("disabled in offline policy checks")

          class _Util:
              @staticmethod
              def pytorch_cos_sim(*args, **kwargs):
                  raise RuntimeError("semantic backend should be stubbed by tests")

          sentence_transformers.SentenceTransformer = _UnavailableModel
          sentence_transformers.util = _Util()
          sys.modules["sentence_transformers"] = sentence_transformers

          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_topic_policy",
              "tests.test_editorial_freshness_policy",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  p1b-bootstrap:
    if: github.event_name == 'push' && github.ref_name == 'agent/p1b-myth-fact-fidelity'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Guard exact generated-code indentation recovery parent and scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="702f84e8a31cedc90d17290f661abbfcc66779b0"
          FIRST="6d054749d9c7421f885b2e268288d27d7e176663"
          CORRECTIVE="375cf2cc8148cff1f1e68f1f424d2f8ffc24903c"
          RECOVERY="b63f370e6f983834e9f0a1cade20dfbeb2245857"
          CLEANUP="8ad43b475ce7207bbc14bdd9bebf85c58e72237b"
          GEMINI="aa5d89b643a34a1170ade9bee9e9afb2b0a64028"
          PUBLISHER="e95efe5a0ac814aab57f24fe3346838ffd9d3707"
          INDENTATION="95b4a18f7b905dff973b6c63539cff766da79ad7"
          REGRESSION="4f3095c42c66eb7732bc489765ae4def6d879df3"
          test "$GITHUB_REF_NAME" = "agent/p1b-myth-fact-fidelity"
          test "$(git rev-parse HEAD^)" = "$REGRESSION"
          test "$(git rev-parse HEAD^^)" = "$INDENTATION"
          test "$(git rev-parse HEAD^^^)" = "$PUBLISHER"
          test "$(git rev-parse HEAD^^^^)" = "$GEMINI"
          test "$(git rev-parse HEAD^^^^^)" = "$CLEANUP"
          test "$(git rev-parse HEAD^^^^^^)" = "$RECOVERY"
          test "$(git rev-parse HEAD^^^^^^^)" = "$CORRECTIVE"
          test "$(git rev-parse HEAD^^^^^^^^)" = "$FIRST"
          test "$(git rev-parse HEAD^^^^^^^^^)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = "9"
          test "$(git rev-list --count "$BASE"..HEAD^)" = "8"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$BASE"..HEAD^)" = ".github/workflows/publisher_policy_pr_checks.yml"
          test "$(git diff --name-only "$BASE"..HEAD)" = ".github/workflows/publisher_policy_pr_checks.yml"
          test "$(git diff --name-only "$REGRESSION"..HEAD)" = ".github/workflows/publisher_policy_pr_checks.yml"

