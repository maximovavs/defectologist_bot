          llm = llm[:gemini_start] + gemini_fragment + llm[gemini_end:]

          import_anchor = '''    generate_image_prompt_async,
              generate_post_plain_from_evidence_async,
              validate_pro_evidence_for_generation,
          )
          '''
          import_new = '''    generate_image_prompt_async,
              generate_post_plain_from_evidence_async,
              validate_myth_fact_evidence_for_generation,
