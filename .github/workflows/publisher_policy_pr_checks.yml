          if pre_llm_pro_count != 1:
              raise RuntimeError(
                  f"publisher pre-LLM myth gate: expected exactly one bounded pro anchor, found {pre_llm_pro_count}"
              )

          myth_pre_llm_block = (
              '                if llm_rubric_format == "myth_fact":\n'
