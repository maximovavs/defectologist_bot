      - name: Install policy-test dependencies
        run: |
          python -m pip install \
            "requests>=2.31.0,<3" \
            "beautifulsoup4>=4.12.2" \
            "lxml>=5.1.0" \
            "PyYAML>=6.0.1" \
            "Pillow>=10.3.0" \
            "python-dateutil>=2.9.0.post0" \
            "feedparser>=6.0.11"

      - name: Compile P1B paths
        run: |
          python -m py_compile \
            src/services/llm_generator.py \
            src/publisher/run_publisher.py \
            tests/test_myth_fact_fidelity.py

      - name: Run P1B and publisher policy regressions offline
        env:
          GEMINI_API_KEY: ""
          GEMINI_VISUAL_QA_API_KEY: ""
          GROQ_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_DRAFTS_CHAT_ID: ""
          POLLINATIONS_TOKEN: ""
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
        run: |
          python - <<'PY'
          import sys
          import types
          import unittest
          sentence_transformers = types.ModuleType("sentence_transformers")
          class _UnavailableModel:
              def __init__(self, *args, **kwargs):
                  raise RuntimeError("disabled in offline policy checks")
          class _Util:
              @staticmethod
              def pytorch_cos_sim(*args, **kwargs):
                  raise RuntimeError("semantic backend should be stubbed by tests")
          sentence_transformers.SentenceTransformer = _UnavailableModel
          sentence_transformers.util = _Util()
          sys.modules["sentence_transformers"] = sentence_transformers
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_topic_policy",
              "tests.test_editorial_freshness_policy",
              "tests.test_myth_fact_fidelity",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Verify final diff scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="702f84e8a31cedc90d17290f661abbfcc66779b0"
          git add \
            .github/workflows/publisher_policy_pr_checks.yml \
            src/publisher/run_publisher.py \
            src/services/llm_generator.py \
            tests/test_myth_fact_fidelity.py
          git diff --cached --check "$BASE"
          ACTUAL="$(git diff --cached --name-only "$BASE" | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/publisher_policy_pr_checks.yml' \
            'src/publisher/run_publisher.py' \
            'src/services/llm_generator.py' \
            'tests/test_myth_fact_fidelity.py' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          STATUS_PATHS="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          test "$STATUS_PATHS" = "$EXPECTED"
          ! grep -q 'workflow_dispatch' .github/workflows/publisher_policy_pr_checks.yml
          ! grep -q '^  push:' .github/workflows/publisher_policy_pr_checks.yml
          ! grep -q 'p1b-bootstrap' .github/workflows/publisher_policy_pr_checks.yml
          ! grep -q 'contents: write' .github/workflows/publisher_policy_pr_checks.yml
          grep -q 'contents: read' .github/workflows/publisher_policy_pr_checks.yml

      - name: Commit and push final P1B patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce myth fact claim fidelity"
          git push origin HEAD:agent/p1b-myth-fact-fidelity
