name: SAFE03 isolated offline policy candidate
on:
  pull_request:
    branches: [main]
    paths:
      - "SAFE03_*.json"
      - "config/sources.yml"
      - "config/rubrics.yml"
      - "config/topics.yml"
      - "tests/test_content_grounding.py"
      - "tests/test_parent_hearing_inference.py"
      - "tests/test_parent_age_policy.py"
      - "tests/test_parent_oral_safety.py"
      - "src/services/safe03_*.py"
      - "tests/test_safe03_*.py"
      - "tools/safe03_*.py"
      - "src/publisher/run_publisher.py"
      - "src/publisher/dedup_policy.py"
      - "src/services/publication_store.py"
      - "src/services/llm_generator.py"
      - "src/services/visual_pipeline.py"
      - "tests/test_visual_fallback_policy.py"
      - "tests/test_publication_delivery_state.py"
      - "tests/test_telegram_visual_delivery.py"
      - ".github/workflows/post.yml"
      - ".github/workflows/publisher_policy_pr_checks.yml"
      - ".github/workflows/safe03_offline_pr_checks.yml"
permissions:
  contents: read
jobs:
  safe03-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install bounded offline test dependencies
        run: |
          python -m pip install \
            "requests>=2.31.0,<3" \
            "beautifulsoup4>=4.12.2" \
            "lxml>=5.1.0" \
            "PyYAML>=6.0.1" \
            "Pillow>=10.3.0" \
            "python-dateutil>=2.9.0.post0" \
            "feedparser>=6.0.11"
      - name: Offline SAFE03 policy and production-seam regressions
        env:
          GEMINI_API_KEY: ""
          GEMINI_VISUAL_QA_API_KEY: ""
          GROQ_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_DRAFTS_CHAT_ID: ""
          POLLINATIONS_TOKEN: ""
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: ""
        run: python tools/safe03_r6p_ci_entrypoint.py
