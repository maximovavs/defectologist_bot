version: 2.5

channel:
  locale: "ru-RU"
  timezone: "Asia/Nicosia"
  disclaimer: "Информация носит образовательный характер и не заменяет консультация специалиста."
  hashtags: ["#логопед", "#речь", "#билингвизм", "#развитиеРечи"]

branding:
  card_theme: "kids"
  card_footer: "Русский логопед онлайн • без воды • с источниками"
  card_accent: "#4A90E2"

publishing:
  max_posts_per_run: 1
  max_posts_per_audience_per_run: 1

  drafts_mode: "post_to_drafts_chat"
  drafts_chat_id_env: "TELEGRAM_DRAFTS_CHAT_ID"

  dashboard_chat: "drafts"
  dashboard_title: "Quality dashboard недели"

audiences:
  parents:
    title_suffix: "• для родителей"
    rubrics:
      # ПОНЕДЕЛЬНИК: Совет логопеда
      - id: tip_of_day
        title: "Совет логопеда дня"
        kind: advice
        cadence: "WEEKLY"
        byweekday: ["MO"]
        sources:
          - "hanen_parent_tips"
          - "handyhandouts_parent_tips"
          - "fraser_parent_speech_tips"
          - "nationwidechildrens_speech_language"
          - "naeyc_family_communication"
          - "kidskey_speech_games"
          - "actionforchildren_communication_milestones"
          - "gosh_speech_language_12_24_months"
          - "healthychildren_language_development"
          - "cincinnatichildrens_language_development"
          - "mayoclinic_language_milestones"
          - "asha_developmental_milestones"
          - "asha_public_speech_sound_disorders"
          - "hanen_bilingual_myths"
          - "habilnet_bilingual_parents"
          - "cal_dual_language_home_support"
          - "carla_family_resources"
          - "docdeti_bilingualism"
          - "russkiymir_bilingual_family"
        format: "tip_of_day"
        media: ["image_card"]

      # ВТОРНИК: Игры
      - id: play_and_speak
        title: "Играем и говорим"
        kind: advice
        cadence: "WEEKLY"
        byweekday: ["TU"]
        sources:
          - "hanen_parent_tips"
          - "handyhandouts_parent_tips"
          - "nationwidechildrens_speech_language"
          - "kidskey_speech_games"
          - "logorina_latest"
          - "gosh_speech_language_12_24_months"
          - "naeyc_family_communication"
          - "actionforchildren_communication_milestones"
          - "healthychildren_language_development"
          - "cincinnatichildrens_language_development"
          - "mayoclinic_language_milestones"
        format: "exercise_steps"
        media: ["image_card"]

      # СРЕДА: Миф/Факт
      - id: myth_fact
        title: "Миф / Факт"
        kind: digest
        cadence: "WEEKLY"
        byweekday: ["WE"]
        sources:
          - "hanen_bilingual_myths"
          - "healthychildren_bilingual_myths"
          - "habilnet_bilingual_parents"
          - "asha_multilingual_public"
          - "zerotothree_dual_language"
          - "colorin_bilingual_parents"
        format: "myth_fact"
        media: ["image_card"]

      - id: bilingual_corner
        title: "Русский за границей"
        kind: bilingual
        cadence: "WEEKLY"
        byweekday: ["TH"]
        sources:
          - "asha_multilingual_public"
          - "asha_practice_portal_multilingual_service_delivery"
          - "colorin_bilingual_parents"
          - "hanen_bilingual_myths"
          - "habilnet_bilingual_parents"
          - "cal_dual_language_home_support"
          - "carla_family_resources"
          - "tewhariki_multilingual_pathways"
          - "docdeti_bilingualism"
          - "russkiymir_bilingual_family"
          - "logoportal_latest"
        format: "bilingual_parents"
        media: ["image_card"]

      # ПЯТНИЦА: Вопрос недели
      - id: question_week
        title: "Вопрос недели"
        kind: question_week
        cadence: "WEEKLY"
        byweekday: ["FR"]
        sources:
          - "healthychildren_bilingual_myths"
          - "healthychildren_language_development"
          - "zerotothree_dual_language"
          - "habilnet_bilingual_parents"
          - "asha_multilingual_public"
        format: "question_week"
        media: ["image_card"]

      # ВОСКРЕСЕНЬЕ: Возрастная норма
      - id: age_norms
        title: "Возрастная норма"
        kind: norms
        cadence: "WEEKLY"
        byweekday: ["SU"]
        sources:
          - "cdc_developmental_milestones"
          - "asha_developmental_milestones"
          - "healthychildren_language_development"
          - "mayoclinic_language_milestones"
          - "cincinnatichildrens_language_development"
          - "actionforchildren_communication_milestones"
          - "gosh_speech_language_12_24_months"
        format: "age_norms"
        media: ["image_card"]

      # Технический отчёт (всегда в drafts)
      - id: quality_dashboard
        title: "Quality dashboard"
        kind: dashboard
        cadence: "WEEKLY"
        byweekday: ["SU"]
        sources: []
        format: "quality_dashboard"
        media: ["text_only"]

  pros:
