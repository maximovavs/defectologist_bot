version: 2.4

channel:
  locale: "ru-RU"
  timezone: "Asia/Nicosia"
  disclaimer: "Информация носит образовательный характер и не заменяет консультацию специалиста."
  hashtags: ["#логопед", "#речь", "#билингвизм", "#развитиеРечи"]

branding:
  card_theme: "kids"  # minimal | kids | scientific
  card_footer: "Русский логопед онлайн • без воды • с источниками"
  card_accent: "#4A90E2"

publishing:
  # ✅ чтобы была ровно 1 рубрика в день
  max_posts_per_run: 1
  max_posts_per_audience_per_run: 1

  drafts_mode: "post_to_drafts_chat"   # skip | post_to_drafts_chat
  drafts_chat_id_env: "TELEGRAM_DRAFTS_CHAT_ID"

  # defense-in-depth (hotfix в коде все равно принудительно шлёт dashboard в drafts)
  dashboard_chat: "drafts"    # main | drafts
  dashboard_title: "Quality dashboard недели"

audiences:
  parents:
    title_suffix: "• для родителей"
    rubrics:
      # ПОНЕДЕЛЬНИК: Совет логопеда
      - id: tip_of_day
        title: "Совет логопеда дня"
        kind: advice
        cadence: "WEEKLY"
        byweekday: ["MO"]
        sources:
          - "logopediya_documents_rss"
          - "logopediya_ppt_rss"
          - "logorina_latest"
          - "logopedy_articles_latest"
        format: "tip_of_day"
        media: ["image_card"]

      # ВТОРНИК: Игры
      - id: play_and_speak
        title: "Играем и говорим"
        kind: advice
        cadence: "WEEKLY"
        byweekday: ["TU"]
        sources:
          - "logorina_latest"
          - "logopedy_articles_latest"
        format: "exercise_steps"
        media: ["image_card"]

      # СРЕДА: Миф/Факт
      - id: myth_fact
        title: "Миф / Факт"
        kind: digest
        cadence: "WEEKLY"
        byweekday: ["WE"]
        sources:
          - "asha_multilingual_public"
          - "asha_practice_portal_multilingual_service_delivery"
          - "pmc_bilingual_science"
          - "pmc_code_switching_exposure_children"
          - "pmc_code_switching_parents_infants"
        format: "myth_fact"
        media: ["image_card"]

      # ЧЕТВЕРГ: Русский за границей
      - id: bilingual_corner
        title: "Русский за границей"
        kind: bilingual
        cadence: "WEEKLY"
        byweekday: ["TH"]
        sources:
          - "asha_multilingual_public"
          - "asha_practice_portal_multilingual_service_delivery"
          - "colorin_bilingual_parents"
          - "pmc_bilingual_science"
          - "logoportal_latest"
        format: "bilingual_parents"
        media: ["image_card"]

      # ПЯТНИЦА: Вопрос недели (временно; позже замените на tts_audio)
      - id: question_week
        title: "Вопрос недели"
        kind: question_week
        cadence: "WEEKLY"
        byweekday: ["FR"]
        sources:
          - "asha_multilingual_public"
          - "colorin_bilingual_parents"
        format: "question_week"
        media: ["image_card"]

      # ВОСКРЕСЕНЬЕ: Возрастная норма
      # ✅ Milestones — ПЕРВЫМ, чтобы рубрика реально была про нормы.
      - id: age_norms
        title: "Возрастная норма"
        kind: norms
        cadence: "WEEKLY"
        byweekday: ["SU"]
        sources:
          - "asha_developmental_milestones"
          - "logoportal_latest"
          - "logopediya_documents_rss"
        format: "age_norms"
        media: ["image_card"]

      # Технический отчёт (всегда в drafts), не должен "съедать" лимит постов дня
      - id: quality_dashboard
        title: "Quality dashboard"
        kind: dashboard
        cadence: "WEEKLY"
        byweekday: ["SU"]
        sources: []
        format: "quality_dashboard"
        media: ["text_only"]

  pros:
    title_suffix: "• для специалистов"
    rubrics:
      # СУББОТА: Методическая копилка
      - id: method_piggybank
        title: "Методическая копилка"
        kind: digest
        cadence: "WEEKLY"
        byweekday: ["SA"]
        sources:
          - "logomag_lib_latest"
          - "logoportal_latest"
          - "logopedy_articles_latest"
          - "asha_practice_portal_articulation_phonology"
          - "asha_practice_portal_multilingual_service_delivery"
        format: "pro_friendly"
        media: ["image_card"]
